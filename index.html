<!DOCTYPE html>
<html>
<head>
    <title>Movie Recommendation System</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background-color:#f4f4f4;
            text-align:center;
            margin-top:50px;
        }

        .container{
            width:450px;
            margin:auto;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
        }

        input{
            width:80%;
            padding:10px;
            margin:10px;
            font-size:16px;
        }

        button{
            padding:10px 20px;
            background:#007BFF;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background:#0056b3;
        }

        ul{
            list-style:none;
            padding:0;
        }

        li{
            background:#e9ecef;
            margin:5px;
            padding:10px;
            border-radius:5px;
        }
    </style>
</head>

<body>

<div class="container">

<h1>🎬 Movie Recommendation System</h1>

<form method="POST">

<input
type="text"
name="movie"
placeholder="Enter movie name..."
required>

<br>

<button type="submit">Recommend</button>

</form>

{% if recommendations %}

<h2>Recommended Movies</h2>

<ul>

{% for movie in recommendations %}

<li>{{ movie }}</li>

{% endfor %}

</ul>

{% endif %}

</div>

</body>
</html>
